
name: SaltMai 曲库更新


on:
  workflow_dispatch:
    inputs:
      mode:
        description: 执行模式
        type: choice
        required: true
        default: check
        options:
          - check
          - release
      version:
        description: 发布版本号，例如 0.8.0
        type: string
        required: false

permissions:
  contents: write


jobs:
  update-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 获取仓库代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      - name: 获取官方模块构建工具
        if: ${{ inputs.mode == 'release' }}
        uses: actions/checkout@v4
        with:
          repository: finall1008/rear-card-bridge
          path: .bridge-toolkit


      - name: 设置发布版本
        if: ${{ inputs.mode == 'release' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/set-release-version.cjs

          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "该版本已经发布，请填写新版本号"
            exit 1
          fi


      - name: 下载最新落雪曲库与别名
        run: |
          curl -fLsS --retry 2 --max-time 90 \
            "https://maimai.lxns.net/api/v0/maimai/song/list" \
            -o data/lxns.json

          curl -fLsS --retry 2 --max-time 90 \
            "https://maimai.lxns.net/api/v0/maimai/alias/list" \
            -o data/lxns-aliases.json

      - name: 生成 SaltMai 曲库
        run: |
          node --check scripts/build-catalog.cjs
          node scripts/build-catalog.cjs

      - name: 检查生成结果
        run: |
          node -e "global.window={};require('./card/assets/catalog.js');const s=window.SALTMAI_CATALOG.songs;if(s.length<100||s.some(x=>x[4].length>3))throw Error('曲库异常');console.log('检查通过：'+s.length+' 首歌曲');"



      - name: 对比 R2 曲绘
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          aws s3 ls "s3://saltmai-assets/maimai/jackets/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT" \
            > r2-cover-list.txt

          node scripts/find-missing-covers.cjs

      - name: 补充缺失曲绘到 R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          COUNT=$(node -p "require('./missing-covers.json').length")

          if [ "$COUNT" -eq 0 ]; then
            echo "R2 曲绘已齐全，无需下载"
            exit 0
          fi

          npm install --no-save --no-package-lock sharp

          node scripts/build-covers.cjs --missing-only

          for id in $(node -p "require('./missing-covers.json').join(' ')"); do
            FILE="dist-covers/$id.webp"

            if [ -f "$FILE" ]; then
              aws s3 cp "$FILE" \
                "s3://saltmai-assets/maimai/jackets/$id.webp" \
                --endpoint-url "$R2_ENDPOINT" \
                --content-type "image/webp" \
                --only-show-errors

              echo "已上传: $id.webp"
            else
              echo "未能获取曲绘: $id"
            fi
          done


      - name: 保存曲库文件
        uses: actions/upload-artifact@v4
        with:
          name: saltmai-catalog
          path: |
            card/assets/catalog.js
            data/lxns.json
            data/lxns-aliases.json
          retention-days: 3


      - name: 构建模块 ZIP
        if: ${{ inputs.mode == 'release' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          npm ci --prefix .bridge-toolkit/tools/card-build

          ZIP="saltmai-random-v${RELEASE_VERSION}.zip"

          node .bridge-toolkit/tools/card-build/bin/card-build.js \
            . "$ZIP"

          unzip -tq "$ZIP"

      - name: 更新 GitHub 仓库曲库
        if: ${{ inputs.mode == 'release' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            module.json \
            data/lxns.json \
            data/lxns-aliases.json \
            card/assets/catalog.js

          if git diff --cached --quiet; then
            echo "曲库与版本数据没有变化"
          else
            git commit -m "Update SaltMai Random v${RELEASE_VERSION}"
            git push origin HEAD:main
          fi

      - name: 发布 GitHub Release
        if: ${{ inputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ZIP="saltmai-random-v${RELEASE_VERSION}.zip"

          gh release create "v${RELEASE_VERSION}" "$ZIP" \
            --target "$(git rev-parse HEAD)" \
            --title "SaltMai Random v${RELEASE_VERSION}" \
            --notes "曲库与别名更新。" \
            --latest


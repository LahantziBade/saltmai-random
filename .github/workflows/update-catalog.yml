
name: SaltMai 曲库更新

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 获取仓库代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 下载最新落雪曲库与别名
        run: |
          curl -fLsS --retry 2 --max-time 90 \
            "https://maimai.lxns.net/api/v0/maimai/song/list" \
            -o data/lxns.json

          curl -fLsS --retry 2 --max-time 90 \
            "https://maimai.lxns.net/api/v0/maimai/alias/list" \
            -o data/lxns-aliases.json

      - name: 生成 SaltMai 曲库
        run: |
          node --check scripts/build-catalog.cjs
          node scripts/build-catalog.cjs

      - name: 检查生成结果
        run: |
          node -e "global.window={};require('./card/assets/catalog.js');const s=window.SALTMAI_CATALOG.songs;if(s.length<100||s.some(x=>x[4].length>3))throw Error('曲库异常');console.log('检查通过：'+s.length+' 首歌曲');"


      - name: 检查 R2 现有曲绘
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          aws --version

          aws s3 ls "s3://saltmai-assets/maimai/jackets/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT" \
            | awk '$4 ~ /\.webp$/ { count++ } END { print "R2 WebP 曲绘数量:", count + 0 }'


      - name: 保存曲库文件
        uses: actions/upload-artifact@v4
        with:
          name: saltmai-catalog
          path: |
            card/assets/catalog.js
            data/lxns.json
            data/lxns-aliases.json
          retention-days: 3

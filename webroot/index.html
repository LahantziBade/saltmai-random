
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SaltMai Random</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 26px 20px;
      background: #f3f7fc;
      font-family: system-ui, sans-serif;
      color: #20314b;
    }

    h1 {
      font-size: 27px;
      margin: 0 0 8px;
    }

    .hint {
      color: #7386a3;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .panel {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 5px 18px #1c437610;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
    }

    .value {
      color: #687f9f;
      margin: 12px 0 20px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      background: #3d7ad7;
      color: white;
      font-size: 16px;
      width: 100%;
    }

    button:disabled {
      opacity: .55;
    }

    #status {
      margin-top: 18px;
      color: #526d92;
      font-size: 14px;
    }

    #status:empty,
    #random-message:empty {
      display: none;
    }

    .stats-panel {
      margin-top: 18px;
    }

    .stats-head, .stats-subhead, .stats-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .stats-head {
      margin-bottom: 22px;
    }

    .stats-link-btn {
      width: auto;
      padding: 9px 11px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      background: #e9f1ff;
      color: #376bb9;
    }

    .stats-numbers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }

    .stats-small {
      display: block;
      color: #7386a3;
      font-size: 13px;
    }

    .stats-number {
      display: block;
      margin-top: 6px;
      color: #20314b;
      font-size: 30px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stats-unit {
      color: #7386a3;
      font-size: 13px;
      font-weight: 400;
    }

    .stats-subhead {
      margin-bottom: 6px;
    }

    .stats-subhead h3 {
      margin: 0;
      font-size: 16px;
    }

    .stats-subhead span {
      color: #8294ad;
      font-size: 12px;
    }

    .stats-history-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 68px;
      padding: 12px 0;
      border-bottom: 1px solid #eaf0f8;
    }

    .stats-music-icon {
      width: 22px;
      color: #759bd0;
      font-size: 21px;
      text-align: center;
    }

    .stats-song-detail {
      flex: 1;
      min-width: 0;
    }

    .stats-song-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      color: #20314b;
    }

    .stats-song-meta {
      margin-top: 4px;
      color: #8294ad;
      font-size: 12px;
    }

    .stats-history-time {
      white-space: nowrap;
      font-size: 12px;
      color: #8294ad;
    }

    .stats-empty {
      padding: 22px 0;
      text-align: center;
      color: #8294ad;
      font-size: 14px;
    }

    .stats-actions {
      justify-content: flex-end;
      margin-top: 18px;
    }

    .stats-actions button {
      width: auto;
      padding: 9px 12px;
      font-size: 13px;
      background: #eef3fb;
      color: #53749e;
    }

    .stats-note {
      margin-top: 12px;
      font-size: 12px;
      color: #8294ad;
    }

    .ranking-dialog[hidden] {
      display: none;
    }

    .ranking-dialog {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: block;
      overflow-y: auto;
      padding: 24px 18px 36px;
      background: rgba(21, 37, 62, 0.44);
      -webkit-overflow-scrolling: touch;
    }

    .ranking-sheet {
      display: block;
      width: 100%;
      max-width: 520px;
      min-height: 180px;
      height: auto;
      max-height: none;
      margin: 0 auto;
      padding: 22px;
      background: #FFFFFF;
      border-radius: 18px;
      box-shadow: 0 12px 40px #172b4c30;
      overflow: visible;
    }

    .ranking-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ranking-head h2 {
      margin: 0;
      font-size: 19px;
    }

    .ranking-head button {
      width: auto;
      padding: 9px 14px;
      background: #e9f1ff;
      color: #376bb9;
      font-size: 13px;
    }

    .ranking-list {
      list-style: none;
      margin: 18px 0 0;
      padding: 0;
    }

    .stats-rank-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #eaf0f8;
    }

    .stats-rank-number {
      width: 22px;
      color: #4c7fc4;
      font-weight: 700;
    }

    .stats-rank-title {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .stats-rank-count {
      white-space: nowrap;
      color: #6684ac;
      font-size: 13px;
    }
    /* 整体背景 */
    html {
      min-height: 100%;
      background: #eef3fa;
    }

    body {
      position: relative;
      z-index: 0;
      min-height: 100vh;
      background: transparent;
      color: #26364f;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;

      background-image:
        linear-gradient(
          rgba(247, 249, 253, 0.48),
          rgba(247, 249, 253, 0.48)
        ),
        url('assets/SaltMaiBG.webp');

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* 顶部 Logo */
    .brand-logo {
      display: block;
      width: 120px;
      max-width: 75%;
      height: auto;
      margin: 0 0 24px;
      object-fit: contain;
    }

    /* 缓存、统计面板 */
    .panel {
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.48);
      border-radius: 18px;
      box-shadow: none;

      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    /* 主操作按钮 */
    #clear {
      background: rgba(61, 122, 215, 0.82);
      color: #ffffff;
    }

    /* 次要操作按钮 */
    .stats-link-btn,
    .stats-actions button,
    .ranking-head button {
      background: rgba(193, 216, 246, 0.42);
      color: #335f97;
    }

    /* 排行榜弹窗 */
    .ranking-sheet {
      background: rgba(247, 250, 255, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow: none;

      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }
  </style>
</head>

<body>
  <img
    class="brand-logo"
    src="assets/SaltMaiLogo.webp"
    alt="SaltMai Random"
  >

  <div class="panel">
    <div class="title">曲绘缓存</div>

    <div class="value" id="cache-info">
      读取中…
    </div>

    <button id="clear">
      清理所有曲绘缓存
    </button>

    <div id="status" role="status" aria-live="polite"></div>
  </div>

  <div class="panel stats-panel">
    <div class="stats-head">
      <div class="title">随机统计</div>
      <button id="open-ranking" class="stats-link-btn">
        随机次数排行榜
      </button>
    </div>

    <div class="stats-numbers">
      <div>
        <span class="stats-small">累计随机</span>
        <span class="stats-number">
          <span id="random-total">0</span>
          <span class="stats-unit"> 次</span>
        </span>
      </div>

      <div>
        <span class="stats-small">今日随机</span>
        <span class="stats-number">
          <span id="random-today">0</span>
          <span class="stats-unit"> 次</span>
        </span>
      </div>
    </div>

    <div class="stats-subhead">
      <h3>最近随机</h3>
    </div>

    <div id="random-history"></div>

    <div class="stats-actions">
      <button id="clear-history">清空记录</button>
      <button id="reset-counts">重置次数</button>
    </div>

    <div
      id="random-message"
      class="stats-note"
      role="status"
      aria-live="polite"
    ></div>
  </div>

  <div id="ranking-dialog" class="ranking-dialog" hidden>
    <div
      class="ranking-sheet"
      role="dialog"
      aria-modal="true"
      aria-label="随机次数排行榜"
    >
      <div class="ranking-head">
        <h2>随机次数排行榜</h2>
        <button id="close-ranking">关闭</button>
      </div>

      <ol id="random-ranking" class="ranking-list"></ol>
    </div>
  </div>

  <script src="bridge-shim.js"></script>
  <script src="main.js"></script>
  <script src="stats.js"></script>
</body>
</html>
